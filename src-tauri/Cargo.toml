[package]
name = "blurlist-app"
description = "Blurlist desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "blurlist_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "blurlist-app"
path = "src/main.rs"

[features]
default = ["download-ort"]
download-ort = ["blurlist-core/download-ort"]
load-dynamic = ["blurlist-core/load-dynamic"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
blurlist-core = { path = "../crates/blurlist-core", default-features = false }
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
base64 = "0.22"
percent-encoding = "2.3"
